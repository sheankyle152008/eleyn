<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Monthsary</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #000;
    }

    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: url(1388b955-3df1-4703-80d5-2ac6dde630d8.jpg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .card {
      background: rgba(10, 0, 150, 0.82);
      color: #fff;
      width: 100%;
      max-width: 640px;
      padding: 28px 32px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      line-height: 1.6;
      text-align: center;
    }

    .card a {
      color: #7dd3fc;
      text-decoration: none;
      cursor: pointer;
    }
    .card a:hover { text-decoration: underline; }

    .love-section {
      display: none;
      opacity: 0;
      width: 100%;
      max-width: 640px;
      margin-top: 24px;
      animation: fadeUp 0.8s ease forwards;
      transition: opacity 1.2s ease;
    }
    .love-section.visible {
      display: block;
    }
    .love-section.fadeout {
      opacity: 0 !important;
      pointer-events: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .moment {
      background: rgba(10, 0, 150, 0.82);
      color: #fff;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .moment.pop {
      opacity: 1;
      transform: translateY(0);
    }

    .moment img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .moment .caption {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(255,255,255,0.92);
    }

    .moment .caption strong {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
      color: #fff;
    }

    /* ── End button ── */
    .end-btn-wrap {
      text-align: center;
      margin: 10px 0 32px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .end-btn-wrap.pop {
      opacity: 1;
      transform: translateY(0);
    }
    .end-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.5);
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .end-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    /* ── Final message ── */
    .final-screen {
      display: none;
      opacity: 0;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 40px;
      transition: opacity 1.8s ease;
    }
    .final-screen.show {
      display: flex;
    }
    .final-screen.fadein {
      opacity: 1;
    }

    .final-text {
      color: #fff;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.02em;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.5s ease 0.6s, transform 1.5s ease 0.6s;
    }
    .final-text.pop {
      opacity: 1;
      transform: translateY(0);
    }
    .final-text span {
      display: block;
      font-size: 42px;
      margin-top: 12px;
    }

    .final-text {
     color: aqua;
     font-family: 'Times New Roman', Times, serif;
    }

    /* ── Floating hearts ── */
    .heart {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      animation: floatHeart 5s ease-out forwards;
      z-index: 9999;
    }

    @keyframes floatHeart {
      0%   { opacity: 1;   transform: translateY(0)      scale(1);   }
      20%  { opacity: 1;   transform: translateY(-80px)  scale(1.2); }
      60%  { opacity: 0.7; transform: translateY(-250px) scale(1.1); }
      100% { opacity: 0;   transform: translateY(-500px) scale(0.6); }
    }
  </style>
</head>
<body>
  <main class="page">

    <section class="card">
      <h1>HAPPY 5TH MONTHSARY BABE!</h1>
      <p>HAIII BABYYYY, HAPPY 5TH? HAHAHWHAWHAHA CLICK MU PALAAA</p>
      <p><a onclick="showLove(event)" href="#">click(pindot)</a></p>
    </section>

    <div class="love-section" id="loveSection">

      <div class="moment">
        <img src="29258e66-e69b-496e-a1e8-3dd4295c2a2f.jpg" alt="Memory 1" />
        <div class="caption">
          <strong>huwahuwahuwa</strong>
          GAANDDAAAA SO MUCHHHHH(my all time favorite na pictureee)
        </div>
      </div>

      <div class="moment">
        <img src="f8d77f6e-4e1c-42d4-869f-124849e37f61.jpg" alt="Memory 2" />
        <div class="caption">
          <strong>hahahahaha cutiee</strong>
        </div>
      </div>

      <div class="moment">
        <img src="f0ca7676-8e38-4903-af85-d64ef4ceda9a.jpg" alt="Memory 3" />
        <div class="caption">
          <strong>us alwaysss</strong>
        </div>
      </div>

      <!-- end button appears after last moment -->
      <div class="end-btn-wrap" id="endBtnWrap">
        <button class="end-btn" onclick="showFinal(event)">clickkk thissss</button>
      </div>

    </div>
  </main>

  <!-- final screen -->
  <div class="final-screen" id="finalScreen">
    <div class="final-text" id="finalText">
      I Loveee Youuu Alwaysss my Babyyyy!
    </div>
  </div>

  <script>
    function spawnHearts(x, y) {
      const heartEmojis = ['❤️', '🩷', '💕', '💗', '💓', '💖', '🫶'];
      const count = 18;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const heart = document.createElement('span');
          heart.classList.add('heart');
          heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
          const offsetX = (Math.random() - 0.5) * 200;
          heart.style.left = (x + offsetX) + 'px';
          heart.style.top = y + 'px';
          heart.style.fontSize = (16 + Math.random() * 20) + 'px';
          heart.style.animationDuration = (4.5 + Math.random() * 1) + 's';
          document.body.appendChild(heart);
          heart.addEventListener('animationend', () => heart.remove());
        }, i * 60);
      }
    }

    function showLove(event) {
      event.preventDefault();
      spawnHearts(event.clientX, event.clientY);

      const section = document.getElementById('loveSection');
      section.classList.add('visible');

      const moments = section.querySelectorAll('.moment');
      moments.forEach((el, i) => {
        setTimeout(() => el.classList.add('pop'), i * 300);
      });

      // show end button after all moments popped in
      setTimeout(() => {
        document.getElementById('endBtnWrap').classList.add('pop');
      }, moments.length * 300 + 400);

      setTimeout(() => {
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    function showFinal(event) {
      spawnHearts(event.clientX, event.clientY);

      // fade out the love section
      const section = document.getElementById('loveSection');
      section.classList.add('fadeout');

      // show the final screen
      const finalScreen = document.getElementById('finalScreen');
      finalScreen.classList.add('show');

      setTimeout(() => {
        finalScreen.classList.add('fadein');
        setTimeout(() => {
          document.getElementById('finalText').classList.add('pop');
        }, 600);
      }, 50);
    }
  </script>
</body>
</html>
